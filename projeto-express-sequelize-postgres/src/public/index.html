<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Usuários | Painel de cadastro</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">U</div>
        <div>
          <p class="eyebrow">PAINEL DE CONTROLE</p>
          <h1>Usuários</h1>
          <p class="page-description">Cadastre e gerencie os usuários do sistema.</p>
        </div>
      </header>

      <div id="mensagem" class="notice" role="status" aria-live="polite" hidden></div>

      <section class="card form-card" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CADASTRO</p>
            <h2 id="form-title">Adicionar usuário</h2>
          </div>
          <span class="step-badge" aria-hidden="true">01</span>
        </div>

        <form id="form-usuario">
          <div class="form-fields">
            <div class="field">
              <label for="nome">Nome completo</label>
              <input id="nome" name="nome" type="text" maxlength="100" placeholder="Ex.: Maria Oliveira" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" maxlength="150" placeholder="maria@exemplo.com" autocomplete="email" required>
            </div>
          </div>
          <div class="form-actions">
            <button id="cancelar-edicao" class="button button-quiet" type="button" hidden>Cancelar</button>
            <button id="salvar-usuario" class="button button-primary" type="submit">
              <span aria-hidden="true">+</span> Cadastrar usuário
            </button>
          </div>
        </form>
      </section>

      <section class="card list-card" aria-labelledby="list-title">
        <div class="section-heading list-heading">
          <div>
            <p class="eyebrow">DIRETÓRIO</p>
            <h2 id="list-title">Usuários cadastrados</h2>
          </div>
          <span id="total-usuarios" class="count-badge">0 usuários</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col" class="actions-heading">Ações</th>
              </tr>
            </thead>
            <tbody id="lista-usuarios">
              <tr>
                <td class="empty-state" colspan="3">Carregando usuários...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <footer class="page-footer">Gerenciamento de usuários <span aria-hidden="true">·</span> Express + PostgreSQL</footer>
    </main>
  </body>
</html>
